project:
  type: book

book:
  page-navigation: true
  title: "Agent Coders Clinic"
  subtitle: "Participant Guide"
  site-url: "https://nmfs-opensci.github.io/NOAA-quarto-book"
  repo-url: "https://github.com/nmfs-opensci/agent-coders-clinics"
  repo-actions: [edit, source, issue]
  favicon: assets/favicon.ico
  search: true
  chapters:
    - index.qmd
    - part: "Getting Started"
      chapters:
        - content/setup.qmd
        - content/models-and-budget.qmd
    - part: "What Is Agentic Coding?"
      chapters:
        - content/what-is-agentic-coding.qmd
        - content/how-to-work-with-an-agent.qmd
        - content/activity-repo-analysis.qmd
    - part: "Agent Skills"
      chapters:
        - content/skills-100.qmd
        - content/skills-101.qmd
        - content/skills-102.qmd
        - content/skills-103.qmd
    - part: "Reference"
      chapters:
        - content/tool-comparison.qmd
        - content/vertex.qmd
        - content/troubleshooting.qmd

  page-footer:
    right: "This page is built with [Quarto](https://quarto.org/)."
    left: "&copy; CC-1.0"

  sidebar:
    background: "#D9E3E4"
    logo: "https://raw.githubusercontent.com/nmfs-opensci/assets/main/logo/nmfs-opensci-logo3.png"
    favicon: assets/favicon.ico
    pinned: true
    align: center
    tools:
      - icon: globe
        href: https://nmfs-opensci.github.io
        text: "NMFS Open Science"
    style: "docked"
    search: true
    collapse-level: 1

execute:
  echo: false
  code-overflow: wrap

format:
  html:
    theme: [cosmo, assets/theme.scss]
    toc: true
    toc-depth: 3
    number-sections: false

filters:
  - assets/include-files.lua
  - quarto
